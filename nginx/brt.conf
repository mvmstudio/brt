proxy_cache_path /var/cache/nginx/brt levels=1:2 keys_zone=BRT_STATIC:10m inactive=7d use_temp_path=off;

# Upstreams
upstream brt_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream brt_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name brt.mvm.st;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brt.mvm.st;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/brt.mvm.st/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brt.mvm.st/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/brt.mvm.st/chain.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:BRT_SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logs
    access_log /var/log/nginx/brt-access.log;
    error_log /var/log/nginx/brt-error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # --- NO AUTH routes ---

    # PWA files
    location ~ ^/(manifest\.json|robots\.txt|service-worker\.js)$ {
        proxy_pass http://brt_frontend;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Favicons
    location ~ ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|favicon-.*\.png|icon-.*\.png|icon\.png)$ {
        proxy_pass http://brt_frontend;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Next.js static files
    location /_next/static {
        proxy_cache BRT_STATIC;
        proxy_pass http://brt_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Next.js images
    location /_next/image {
        proxy_cache BRT_STATIC;
        proxy_pass http://brt_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Book page images from backend static mount — NO auth, cached
    location /static/images/ {
        proxy_pass http://brt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Backend API — NO basic auth (has JWT)
    location /api/ {
        proxy_pass http://brt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Page images from backend (book pages)
    location /api/pages/ {
        proxy_pass http://brt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=86400";
    }

    # Health check — NO auth
    location = /api/health {
        proxy_pass http://brt_backend;
        access_log off;
    }

    # --- AUTH-protected routes ---

    # All other requests -> Next.js frontend WITH basic auth
    location / {
        auth_basic "BRT Medical Reference";
        auth_basic_user_file /etc/nginx/.htpasswd_brt;

        proxy_pass http://brt_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}
